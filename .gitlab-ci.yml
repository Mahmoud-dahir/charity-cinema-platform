stages:
  - test
  - sonarqube-check
  - sonarqube-vulnerability-report
  - deploy

test-backend:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt pytest pytest-cov pytest-django
    - cd backend
    - pytest --cov=. --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - backend/coverage.xml
  only:
    - main

test-frontend:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm ci || npm install
    - npm test -- --coverage --watchAll=false
  artifacts:
    paths:
      - frontend/coverage/lcov.info
  only:
    - main

sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  script:
    - sonar-scanner
  allow_failure: true
  only:
    - main

deploy_to_vm:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan 192.168.75.115 >> ~/.ssh/known_hosts
  script:
    - ssh gitlabci@192.168.75.115 "export NVM_DIR=\$HOME/.nvm && [ -s \$NVM_DIR/nvm.sh ] && . \$NVM_DIR/nvm.sh && PROJECT_DIR=\$HOME/mif10-projet-transversal-de-master-informatique-2025-2026-g15 && REPO_URL=https://oauth2:${MY_DEPLOY_TOKEN}@forge.univ-lyon1.fr/mif10-projet-transversal-de-master-informatique-2025-2026-g15/mif10-projet-transversal-de-master-informatique-2025-2026-g15.git && pm2 flush && npm cache clean --force && if [ ! -d \$PROJECT_DIR ]; then git clone \$REPO_URL \$PROJECT_DIR; else cd \$PROJECT_DIR && git remote set-url origin \$REPO_URL && git fetch origin && git reset --hard FETCH_HEAD; fi && cd \$PROJECT_DIR/backend && python3 -m venv venv && ./venv/bin/pip install -r requirements.txt && ./venv/bin/python manage.py migrate && cd \$PROJECT_DIR/frontend && npm install typescript --save-prod && npm install --omit=dev --no-audit --no-fund --prefer-offline && export NODE_OPTIONS='--max-old-space-size=768' && npx next build --no-lint && pm2 delete all || true && pm2 start ./venv/bin/python --name backend --cwd \$PROJECT_DIR/backend -- manage.py runserver 0.0.0.0:8000 && pm2 start npm --name frontend --cwd \$PROJECT_DIR/frontend -- start -- -p 3000 && pm2 save"
  only:
    - main