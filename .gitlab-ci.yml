stages:
  - test
  - sonarqube-check
  - sonarqube-vulnerability-report
  - deploy

# ---------------------------------------------------------
# STAGE: TEST
# ---------------------------------------------------------
test-backend:
  stage: test
  image: python:3.11-slim
  only:
    - main
  script:
    - pip install -r backend/requirements.txt pytest pytest-cov pytest-django
    - cd backend
    - pytest --cov=. --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - backend/coverage.xml

test-frontend:
  stage: test
  image: node:20
  only:
    - main
  script:
    - cd frontend
    - npm ci || npm install
    - npm test -- --coverage --watchAll=false
  artifacts:
    paths:
      - frontend/coverage/lcov.info

# ---------------------------------------------------------
# STAGE: SONARQUBE
# ---------------------------------------------------------
sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  only:
    - main
  script:
    - sonar-scanner
  allow_failure: true

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache curl
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=mif10-projet-transversal-de-master-informatique-2025-2026-g15_mif10-projet-transversal-de-master-informatique-2025-2026-g15_AZ0QifQypItf3KCWeGyX&branch=${CI_COMMIT_BRANCH}" -o gl-sast.json || true'
  artifacts:
    reports:
      sast: gl-sast.json
  allow_failure: true

# ---------------------------------------------------------
# STAGE: DEPLOY (Version Ultra-Robuste)
# ---------------------------------------------------------
deploy_to_vm:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan 192.168.75.115 >> ~/.ssh/known_hosts
  script:
    - |
      ssh gitlabci@192.168.75.115 /bin/bash -s << EOT
        set -e
        echo "--- Début du déploiement sur la VM ---"
        
        # 1. Environnement Node/NVM
        export NVM_DIR="\$HOME/.nvm"
        [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"
        
        PROJECT_DIR="\$HOME/mif10-projet-transversal-de-master-informatique-2025-2026-g15"
        REPO_URL="https://oauth2:${MY_DEPLOY_TOKEN}@forge.univ-lyon1.fr/mif10-projet-transversal-de-master-informatique-2025-2026-g15/mif10-projet-transversal-de-master-informatique-2025-2026-g15.git"

        # 2. Mise à jour du code
        if [ ! -d "\$PROJECT_DIR" ]; then
          git clone "\$REPO_URL" "\$PROJECT_DIR"
          cd "\$PROJECT_DIR"
        else
          cd "\$PROJECT_DIR"
          git remote set-url origin "\$REPO_URL"
          git fetch origin
          git reset --hard origin/main
        fi

        # 3. Nettoyage pré-build pour l'espace disque (On a 1.9 Go)
        pm2 flush
        npm cache clean --force
        rm -rf frontend/.next

        # 4. Backend
        echo "--- Build Backend ---"
        cd "\$PROJECT_DIR/backend"
        python3 -m venv venv
        ./venv/bin/pip install -r requirements.txt
        ./venv/bin/python manage.py migrate

        # 5. Frontend
        echo "--- Build Frontend ---"
        cd "\$PROJECT_DIR/frontend"
        # On installe TS car config en .ts, mais on skip le reste (devDeps)
        npm install typescript --save-prod
        npm install --omit=dev --no-audit --no-fund --prefer-offline
        
        # Build standard (plus stable que Turbo sur petite RAM)
        export NODE_OPTIONS='--max-old-space-size=768'
        npx next build --no-lint

        # 6. Relance PM2
        echo "--- Restart Services ---"
        pm2 delete all || true
        pm2 start ./venv/bin/python --name backend --cwd "\$PROJECT_DIR/backend" -- manage.py runserver 0.0.0.0:8000
        pm2 start npm --name frontend --cwd "\$PROJECT_DIR/frontend" -- start -- -p 3000
        pm2 save
        
        echo "--- Déploiement terminé avec succès ! ---"
      EOT
      "
  only:
    - main