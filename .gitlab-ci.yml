stages:
  - test
  - sonarqube-check
  - sonarqube-vulnerability-report
  - build
  - deploy

# ---------------------------------------------------------
# STAGE: TEST
# ---------------------------------------------------------
test-backend:
  stage: test
  image: python:3.11-slim
  only:
    - main
  script:
    - pip install -r backend/requirements.txt pytest pytest-cov pytest-django
    - cd backend
    - pytest --cov=. --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - backend/coverage.xml

test-frontend:
  stage: test
  image: node:20
  only:
    - main
  script:
    - cd frontend
    - npm ci || npm install
    - npm test -- --coverage --watchAll=false
  artifacts:
    paths:
      - frontend/coverage/lcov.info

# ---------------------------------------------------------
# STAGE: SONARQUBE
# ---------------------------------------------------------
sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  only:
    - main
  script:
    - sonar-scanner
  allow_failure: true

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache curl
  script:
    - >
      curl -u "${SONAR_TOKEN}:"
      "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=mif10-projet-transversal-de-master-informatique-2025-2026-g15_mif10-projet-transversal-de-master-informatique-2025-2026-g15_AZ0QifQypItf3KCWeGyX&branch=${CI_COMMIT_BRANCH}"
      -o gl-sast.json || true
  artifacts:
    reports:
      sast: gl-sast.json
  allow_failure: true

# ---------------------------------------------------------
# STAGE: BUILD FRONTEND
# ---------------------------------------------------------
build-frontend:
  stage: build
  image: node:20
  only:
    - main
  script:
    - cd frontend
    - npm ci
    - npm run build
    - mkdir -p public
  artifacts:
    expire_in: 1 day
    paths:
      - frontend/.next/standalone
      - frontend/.next/static
      - frontend/public

# ---------------------------------------------------------
# STAGE: DEPLOY
# ---------------------------------------------------------
deploy_to_vm:
  stage: deploy
  image: alpine:latest
  only:
    - main
  needs:
    - job: build-frontend
      artifacts: true
  before_script:
    - apk add --no-cache openssh-client bash rsync netcat-openbsd
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - nc -zv 192.168.75.115 22
    - ssh-keyscan -H 192.168.75.115 > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

  script:
    - export REMOTE_HOST="gitlabci@192.168.75.115"
    - export REMOTE_PROJECT_DIR="/home/gitlabci/mif10-projet-transversal-de-master-informatique-2025-2026-g15"

    # 1) Préparation projet + backend sur la VM
    - |
      ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$REMOTE_HOST" "MY_DEPLOY_TOKEN='$MY_DEPLOY_TOKEN' /bin/bash -s" <<'EOF'
        set -e

        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
        nvm use 20 >/dev/null 2>&1 || true
        export PATH="$HOME/.nvm/versions/node/v20.20.2/bin:$PATH"

        PROJECT_DIR="$HOME/mif10-projet-transversal-de-master-informatique-2025-2026-g15"
        REPO_URL="https://oauth2:${MY_DEPLOY_TOKEN}@forge.univ-lyon1.fr/mif10-projet-transversal-de-master-informatique-2025-2026-g15/mif10-projet-transversal-de-master-informatique-2025-2026-g15.git"

        if [ ! -d "$PROJECT_DIR" ]; then
          git clone "$REPO_URL" "$PROJECT_DIR"
        fi

        cd "$PROJECT_DIR"
        git remote set-url origin "$REPO_URL"
        git fetch origin
        git reset --hard origin/main

        command -v pm2 >/dev/null 2>&1 || npm install -g pm2

        cd "$PROJECT_DIR/backend"
        [ -d venv ] || python3 -m venv venv
        ./venv/bin/pip install -r requirements.txt
        ./venv/bin/python manage.py migrate

        mkdir -p "$PROJECT_DIR/frontend/.next/static"
        mkdir -p "$PROJECT_DIR/frontend/public"
        rm -rf "$PROJECT_DIR/frontend/.next/standalone"
        rm -f "$PROJECT_DIR/frontend/server.js"
      EOF

    # 2) Copie du build frontend standalone vers la VM
    - >
      rsync -az --delete
      -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
      frontend/.next/standalone/
      ${REMOTE_HOST}:${REMOTE_PROJECT_DIR}/frontend/

    - >
      rsync -az --delete
      -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
      frontend/.next/static/
      ${REMOTE_HOST}:${REMOTE_PROJECT_DIR}/frontend/.next/static/

    - >
      rsync -az --delete
      -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
      frontend/public/
      ${REMOTE_HOST}:${REMOTE_PROJECT_DIR}/frontend/public/

    # 3) Redémarrage des services
    - |
      ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$REMOTE_HOST" /bin/bash -s <<'EOF'
        set -e

        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
        nvm use 20 >/dev/null 2>&1 || true
        export PATH="$HOME/.nvm/versions/node/v20.20.2/bin:$PATH"

        PROJECT_DIR="$HOME/mif10-projet-transversal-de-master-informatique-2025-2026-g15"

        pm2 delete backend || true
        pm2 start "$PROJECT_DIR/backend/venv/bin/python" --name backend --cwd "$PROJECT_DIR/backend" -- manage.py runserver 0.0.0.0:8000

        pm2 delete frontend || true
        cd "$PROJECT_DIR/frontend"
        PORT=3000 HOSTNAME=0.0.0.0 pm2 start "node server.js" --name frontend --cwd "$PROJECT_DIR/frontend"

        pm2 save
      EOF