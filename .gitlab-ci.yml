stages:
  - test
  - sonarqube-check
  - sonarqube-vulnerability-report
  - deploy

test-backend:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt pytest pytest-cov pytest-django
    - cd backend
    - pytest --cov=. --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - backend/coverage.xml
    expire_in: 1 hour
  only:
    - merge_requests
    - master
    - main
    - develop

test-frontend:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm ci || npm install
    - npm test -- --coverage --watchAll=false
  artifacts:
    paths:
      - frontend/coverage/lcov.info
    expire_in: 1 hour
  only:
    - merge_requests
    - master
    - main
    - develop

sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  dependencies:
    - test-backend
    - test-frontend
  script:
    - sonar-scanner
  allow_failure: true
  only:
    - merge_requests
    - master
    - main
    - develop

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=mif10-projet-transversal-de-master-informatique-2025-2026-g15_mif10-projet-transversal-de-master-informatique-2025-2026-g15_AZ0QifQypItf3KCWeGyX&branch=${CI_COMMIT_BRANCH}" -o gl-sast.json || true'
  artifacts:
    reports:
      sast: gl-sast.json
  allow_failure: true
  only:
    - main

deploy_to_vm:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan 192.168.75.115 >> ~/.ssh/known_hosts
  script:
    - |
      ssh p2211469@192.168.75.115 "
        cd /home/p2211469/mif10-projet-transversal-de-master-informatique-2025-2026-g15 && \
        git pull origin main && \
        
        pm2 stop all || true && \
        
        cd backend && \
        python3 -m venv venv && \
        ./venv/bin/pip install -r requirements.txt && \
        ./venv/bin/python manage.py migrate && \
        
        cd ../frontend && \
        source ~/.nvm/nvm.sh && \
        rm -rf .next && \
        npm install && \
        
        export NODE_OPTIONS='--max-old-space-size=1024' && \
        npm run build && \
        
        pm2 restart all || pm2 start ecosystem.config.js
      "
  only:
    - main