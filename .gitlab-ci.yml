stages:
  - sonarqube-check
  - sonarqube-vulnerability-report
  - deploy

# SONARQUBE 
sonarqube-check:
  stage: sonarqube-check
  image: 
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script: 
    - sonar-scanner
  allow_failure: true
  only:
    - merge_requests
    - master
    - main
    - develop

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=mif10-projet-transversal-de-master-informatique-2025-2026-g15_mif10-projet-transversal-de-master-informatique-2025-2026-g15_AZ0QifQypItf3KCWeGyX&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  only:
    - merge_requests
    - master
    - main
    - develop
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json
  dependencies:
    - sonarqube-check

# DÉPLOIEMENT PM2
deploy_to_vm:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\\r' | ssh-add -
    - ssh-keyscan 192.168.75.115 >> ~/.ssh/known_hosts
  script:
    - ssh p2211469@192.168.75.115 "cd /home/p2211469/mif10-projet-transversal-de-master-informatique-2025-2026-g15 && git pull origin main && source ~/.nvm/nvm.sh && pm2 restart all" 
  only:
    - main
  needs: 
    - sonarqube-check  
