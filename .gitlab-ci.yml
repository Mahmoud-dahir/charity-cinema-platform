stages:
  - test
  - sonarqube-check
  - sonarqube-vulnerability-report
  - deploy

test-backend:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r backend/requirements.txt pytest pytest-cov pytest-django
    - cd backend
    - pytest --cov=. --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - backend/coverage.xml
    expire_in: 1 hour
  only:
    - merge_requests
    - master
    - main
    - develop

test-frontend:
  stage: test
  image: node:20
  script:
    - cd frontend
    - npm ci || npm install
    - npm test -- --coverage --watchAll=false
  artifacts:
    paths:
      - frontend/coverage/lcov.info
    expire_in: 1 hour
  only:
    - merge_requests
    - master
    - main
    - develop

sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  dependencies:
    - test-backend
    - test-frontend
  script:
    - sonar-scanner
  allow_failure: true
  only:
    - merge_requests
    - master
    - main
    - develop

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=mif10-projet-transversal-de-master-informatique-2025-2026-g15_mif10-projet-transversal-de-master-informatique-2025-2026-g15_AZ0QifQypItf3KCWeGyX&branch=${CI_COMMIT_BRANCH}" -o gl-sast.json || true'
  artifacts:
    reports:
      sast: gl-sast.json
  allow_failure: true
  only:
    - main

deploy_to_vm:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan 192.168.75.115 >> ~/.ssh/known_hosts
  script:
    - |
      ssh gitlabci@192.168.75.115 "
        # 1. Charger l'environnement Node/NVM
        export NVM_DIR=\"\$HOME/.nvm\"
        [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"
        
        PROJECT_DIR=\"\$HOME/mif10-projet-transversal-de-master-informatique-2025-2026-g15\"

        # 2. Mise à jour du code (UTILISATION DE L'URL SSH)
        if [ ! -d \"\$PROJECT_DIR\" ]; then
          git clone git@forge.univ-lyon1.fr:mif10-projet-transversal-de-master-informatique-2025-2026-g15/mif10-projet-transversal-de-master-informatique-2025-2026-g15.git \"\$PROJECT_DIR\"
        fi
        
        cd \"\$PROJECT_DIR\"
        git fetch origin main && git reset --hard origin/main
        
        # 3. Backend : Venv + Pip + Migrate
        cd \"\$PROJECT_DIR/backend\"
        python3 -m venv venv
        ./venv/bin/pip install -r requirements.txt
        ./venv/bin/python manage.py migrate
        
        # 4. Frontend : Build
        cd \"\$PROJECT_DIR/frontend\"
        npm install
        npm run build
        
        # 5. Relance propre avec PM2 (Précision du dossier avec --cwd)
        pm2 delete all || true
        
        pm2 start ./venv/bin/python --name 'backend' --cwd \"\$PROJECT_DIR/backend\" -- manage.py runserver 0.0.0.0:8000
        
        pm2 start npm --name 'frontend' --cwd \"\$PROJECT_DIR/frontend\" -- start -- -p 3000
        
        pm2 save
      "
  only:
    - main