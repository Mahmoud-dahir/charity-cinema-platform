stages:
  - test
  - sonarqube-check
  - sonarqube-vulnerability-report
  - deploy

# ---------------------------------------------------------
# STAGE: TEST
# ---------------------------------------------------------
test-backend:
  stage: test
  image: python:3.11-slim
  only:
    - main
  script:
    - pip install -r backend/requirements.txt pytest pytest-cov pytest-django
    - cd backend
    - pytest --cov=. --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - backend/coverage.xml

test-frontend:
  stage: test
  image: node:20
  only:
    - main
  script:
    - cd frontend
    - npm ci || npm install
    - npm test -- --coverage --watchAll=false
  artifacts:
    paths:
      - frontend/coverage/lcov.info

# ---------------------------------------------------------
# STAGE: SONARQUBE
# ---------------------------------------------------------
sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  only:
    - main
  script:
    - sonar-scanner
  allow_failure: true

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache curl
  script:
    - >
      curl -u "${SONAR_TOKEN}:"
      "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=mif10-projet-transversal-de-master-informatique-2025-2026-g15_mif10-projet-transversal-de-master-informatique-2025-2026-g15_AZ0QifQypItf3KCWeGyX&branch=${CI_COMMIT_BRANCH}"
      -o gl-sast.json || true
  artifacts:
    reports:
      sast: gl-sast.json
  allow_failure: true

# ---------------------------------------------------------
# STAGE: DEPLOY
# ---------------------------------------------------------
deploy_to_vm:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client bash netcat-openbsd
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - echo "=== Test connectivité SSH vers la VM ==="
    - nc -zv 192.168.75.115 22
    - ssh-keyscan -H 192.168.75.115 >> ~/.ssh/known_hosts 2>/dev/null || true
    - chmod 644 ~/.ssh/known_hosts
script:
    - |
      ssh gitlabci@192.168.75.115 /bin/bash -s <<EOF
        set -e
        echo "--- Début du déploiement sur la VM ---"

        # 1. Environnement
        export NVM_DIR="\$HOME/.nvm"
        [ -s "\$NVM_DIR/nvm.sh" ] && . "\$NVM_DIR/nvm.sh"

        PROJECT_DIR="\$HOME/mif10-projet-transversal-de-master-informatique-2025-2026-g15"
        REPO_URL="https://oauth2:${MY_DEPLOY_TOKEN}@forge.univ-lyon1.fr/mif10-projet-transversal-de-master-informatique-2025-2026-g15/mif10-projet-transversal-de-master-informatique-2025-2026-g15.git"

        rm -f "\$HOME/package-lock.json"

        # 2. Mise à jour du code
        if [ ! -d "\$PROJECT_DIR" ]; then
          git clone "\$REPO_URL" "\$PROJECT_DIR"
          cd "\$PROJECT_DIR"
        else
          cd "\$PROJECT_DIR"
          git remote set-url origin "\$REPO_URL"
          git fetch origin
          git reset --hard origin/main
        fi

        # 3. Nettoyage
        pm2 flush || true
        npm cache clean --force || true
        rm -rf "\$PROJECT_DIR/frontend/.next"

        # 4. Backend
        echo "--- Build Backend ---"
        cd "\$PROJECT_DIR/backend"
        python3 -m venv venv
        ./venv/bin/pip install -r requirements.txt
        ./venv/bin/python manage.py migrate

        # 5. Frontend
        echo "--- Build Frontend ---"
        cd "\$PROJECT_DIR/frontend"
        
        # Installation complète pour avoir Tailwind/PostCSS
        npm install --no-audit --no-fund --prefer-offline

        # On désactive le Lint et le Type-check pendant le build pour économiser la RAM
        export NODE_OPTIONS="--max-old-space-size=768"
        export NEXT_DISABLE_ESLINT=1
        export NEXT_DISABLE_TYPECHECK=1
        
        npx next build

        # 6. Restart services
        echo "--- Restart Services ---"
        pm2 delete all || true
        pm2 start "\$PROJECT_DIR/backend/venv/bin/python" --name backend --cwd "\$PROJECT_DIR/backend" -- manage.py runserver 0.0.0.0:8000
        pm2 start npm --name frontend --cwd "\$PROJECT_DIR/frontend" -- start -- -p 3000
        pm2 save

        echo "--- Déploiement terminé avec succès ! ---"
      EOF