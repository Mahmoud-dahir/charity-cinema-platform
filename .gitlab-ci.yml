stages:
  - test
  - sonarqube-check
  - sonarqube-vulnerability-report
  - deploy

# ---------------------------------------------------------
# STAGE: TEST
# ---------------------------------------------------------
test-backend:
  stage: test
  image: python:3.11-slim
  only:
    - main
  script:
    - pip install -r backend/requirements.txt pytest pytest-cov pytest-django
    - cd backend
    - pytest --cov=. --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - backend/coverage.xml

test-frontend:
  stage: test
  image: node:20
  only:
    - main
  script:
    - cd frontend
    - npm ci || npm install
    - npm test -- --coverage --watchAll=false
  artifacts:
    paths:
      - frontend/coverage/lcov.info

# ---------------------------------------------------------
# STAGE: SONARQUBE
# ---------------------------------------------------------
sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  only:
    - main
  script:
    - sonar-scanner
  allow_failure: true

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache curl
  script:
    - >
      curl -u "${SONAR_TOKEN}:"
      "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=mif10-projet-transversal-de-master-informatique-2025-2026-g15_mif10-projet-transversal-de-master-informatique-2025-2026-g15_AZ0QifQypItf3KCWeGyX&branch=${CI_COMMIT_BRANCH}"
      -o gl-sast.json || true
  artifacts:
    reports:
      sast: gl-sast.json
  allow_failure: true

# ---------------------------------------------------------
# STAGE: DEPLOY
# ---------------------------------------------------------
deploy_to_vm:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client bash netcat-openbsd
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - nc -zv 192.168.75.115 22
    - ssh-keyscan -H 192.168.75.115 > ~/.ssh/known_hosts
  script:
    - |
      ssh gitlabci@192.168.75.115 /bin/bash -s <<'EOF'
        set -e
        echo "--- Début du déploiement optimisé ---"

        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        PROJECT_DIR="$HOME/mif10-projet-transversal-de-master-informatique-2025-2026-g15"

        cd "$PROJECT_DIR"
        git fetch origin
        git reset --hard origin/main

        echo "--- Update Backend ---"
        cd "$PROJECT_DIR/backend"
        python3 -m venv venv --clear
        ./venv/bin/pip install --no-cache-dir -r requirements.txt

        echo "--- Update Frontend ---"
        cd "$PROJECT_DIR/frontend"
        
        if [ ! -d "node_modules" ]; then
          echo "Installation initiale des modules..."
          npm install --no-audit --no-fund --prefer-offline
        else
          echo "Mise à jour légère des modules..."
          npm install --no-audit --no-fund --prefer-offline
        fi

        rm -rf .next
        
        echo "--- Build Next.js (Memory Restricted) ---"
        export NODE_OPTIONS="--max-old-space-size=512"
        npm run build

        echo "--- Restart Services ---"
        pm2 restart backend || pm2 start "./venv/bin/python manage.py runserver 0.0.0.0:8000" --name backend
        pm2 restart frontend || pm2 start "npm start -- -p 3000" --name frontend
        pm2 save

        echo "--- État final des services ---"
        pm2 list
        df -h /
      EOF

  