stages:
  - test
  - sonarqube-check
  - sonarqube-vulnerability-report
  - deploy

# ---------------------------------------------------------
# STAGE: TEST
# ---------------------------------------------------------
test-backend:
  stage: test
  image: python:3.11-slim
  only:
    - main
  script:
    - pip install -r backend/requirements.txt pytest pytest-cov pytest-django
    - cd backend
    - pytest --cov=. --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - backend/coverage.xml

test-frontend:
  stage: test
  image: node:20
  only:
    - main
  script:
    - cd frontend
    - npm ci || npm install
    - npm test -- --coverage --watchAll=false
  artifacts:
    paths:
      - frontend/coverage/lcov.info

# ---------------------------------------------------------
# STAGE: SONARQUBE
# ---------------------------------------------------------
sonarqube-check:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:5.0
    entrypoint: [""]
  only:
    - main
  script:
    - sonar-scanner
  allow_failure: true

sonarqube-vulnerability-report:
  stage: sonarqube-vulnerability-report
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache curl
  script:
    - >
      curl -u "${SONAR_TOKEN}:"
      "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=mif10-projet-transversal-de-master-informatique-2025-2026-g15_mif10-projet-transversal-de-master-informatique-2025-2026-g15_AZ0QifQypItf3KCWeGyX&branch=${CI_COMMIT_BRANCH}"
      -o gl-sast.json || true
  artifacts:
    reports:
      sast: gl-sast.json
  allow_failure: true

# ---------------------------------------------------------
# STAGE: DEPLOY
# ---------------------------------------------------------
deploy_to_vm:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client bash netcat-openbsd
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - echo "=== Test connectivité SSH vers la VM ==="
    - nc -zv 192.168.75.115 22
    - rm -f ~/.ssh/known_hosts
    - ssh-keyscan -H 192.168.75.115 > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

  script:
    - |
      ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" gitlabci@192.168.75.115 /bin/bash -s <<EOF
        set -ex
        echo "--- Début du déploiement sur la VM ---"

        export NVM_DIR="\$HOME/.nvm"
        if [ -s "\$NVM_DIR/nvm.sh" ]; then
          . "\$NVM_DIR/nvm.sh" || true
          nvm use 20 || nvm use default || true
        fi

        export PATH="\$HOME/.nvm/versions/node/v20.20.2/bin:\$PATH"

        echo "--- Vérification environnement ---"
        echo "USER=\$(whoami)"
        echo "HOME=\$HOME"
        echo "node: \$(command -v node || echo introuvable)"
        echo "npm: \$(command -v npm || echo introuvable)"
        echo "pm2: \$(command -v pm2 || echo introuvable)"
        echo "python3: \$(command -v python3 || echo introuvable)"
        echo "git: \$(command -v git || echo introuvable)"

        PROJECT_DIR="\$HOME/mif10-projet-transversal-de-master-informatique-2025-2026-g15"
        REPO_URL="https://oauth2:${MY_DEPLOY_TOKEN}@forge.univ-lyon1.fr/mif10-projet-transversal-de-master-informatique-2025-2026-g15/mif10-projet-transversal-de-master-informatique-2025-2026-g15.git"

        echo "--- Récupération du projet ---"
        rm -f "\$HOME/package-lock.json"

        if [ ! -d "\$PROJECT_DIR" ]; then
          git clone "\$REPO_URL" "\$PROJECT_DIR"
          cd "\$PROJECT_DIR"
        else
          cd "\$PROJECT_DIR"
          git remote set-url origin "\$REPO_URL"
          git fetch origin
          git reset --hard origin/main
        fi

        echo "--- Vérification PM2 ---"
        command -v pm2 || npm install -g pm2

        echo "--- Nettoyage logs/cache ---"
        pm2 flush || true
        npm cache clean --force || true

        echo "--- Build Backend ---"
        cd "\$PROJECT_DIR/backend"
        python3 -m venv venv
        ./venv/bin/pip install -r requirements.txt
        ./venv/bin/python manage.py migrate

        echo "--- Build Frontend ---"
        cd "\$PROJECT_DIR/frontend"
        rm -rf .next

        npm config set fetch-retries 5
        npm config set fetch-retry-mintimeout 20000
        npm config set fetch-retry-maxtimeout 120000
        npm config set registry https://registry.npmjs.org/

        if [ ! -d node_modules ]; then
          npm ci --no-audit --no-fund --prefer-offline
        else
          npm install --no-audit --no-fund --prefer-offline
        fi

        echo "--- Préinstallation SWC Linux ---"
        NEXT_VERSION=\$(node -p "const p=require('./package.json'); (((p.dependencies||{}).next)||((p.devDependencies||{}).next)||'').replace(/^[^0-9]*/, '')")
        npm install --no-save "@next/swc-linux-x64-gnu@\${NEXT_VERSION}"

        export NODE_OPTIONS="--max-old-space-size=768"
        npx next build --webpack

        echo "--- Restart Services ---"
        pm2 delete all || true
        pm2 start "\$PROJECT_DIR/backend/venv/bin/python" --name backend --cwd "\$PROJECT_DIR/backend" -- manage.py runserver 0.0.0.0:8000
        pm2 start npm --name frontend --cwd "\$PROJECT_DIR/frontend" -- start -- -p 3000
        pm2 save

        echo "--- État final PM2 ---"
        pm2 list

        echo "--- Déploiement terminé avec succès ! ---"
      EOF