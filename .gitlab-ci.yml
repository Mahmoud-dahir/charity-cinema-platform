deploy_to_vm:
  stage: deploy
  image: alpine:latest
  only:
    - main
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan 192.168.75.115 >> ~/.ssh/known_hosts
  script:
    - ssh gitlabci@192.168.75.115 "~/deploy.sh"